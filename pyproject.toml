[project]
authors = [
  {name = "Grisha Szep", email = "grisha.szep@gmail.com"},
]
dependencies = [
  "streamdiffusion[tensorrt] (>=0.1.1,<0.2.0)",
  "huggingface-hub (<=0.25.0)",
  "torchvision (>=0.21.0,<0.22.0)",
  "torchaudio (>=2.6.0,<3.0.0)",
  "numpy (<2)",
  "polygraphy (>=0.49.20,<0.50.0)",
  "onnx-graphsurgeon (>=0.5.6,<0.6.0)",
  "tensorrt-cu12 (>=10.9.0.34,<11.0.0.0)",
  "tensorrt-cu12-libs (>=10.9.0.34,<11.0.0.0)",
  "tensorrt-cu12-bindings (>=10.9.0.34,<11.0.0.0)",
  "realtimestt (>=0.3.100,<0.4.0)",
]
description = ""
name = "story-time"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]

[tool.poetry.group.dev.dependencies]
mypy = "1.13.0"

[[tool.poetry.source]]
name = "nvidia"
priority = "supplemental"
url = "https://pypi.nvidia.com/"

[tool.poetry.dependencies]
tensorrt-cu12 = {source = "nvidia"}
tensorrt-cu12-bindings = {source = "nvidia"}
tensorrt-cu12-libs = {source = "nvidia"}

[tool.black]
include = '\.pyi?$'
line-length = 140

[tool.isort]
line_length = 140
profile = "black"

[tool.mypy]
allow_redefinition = true
check_untyped_defs = true
explicit_package_bases = true
files = ["."]
follow_imports = "normal"
ignore_missing_imports = true
local_partial_types = true
namespace_packages = true
python_version = "3.11"
show_column_numbers = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
